name: Deploy server
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency: deploy-server
permissions:
  contents: read
  packages: write
jobs:
  changes:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.check.outputs.server }}
    steps:
      - name: Decide whether server files changed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then echo "server=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Server-side paths: the dashboard alone (apps/dashboard) never triggers a server deploy.
          files=$(gh api "repos/$REPO/commits/$SHA" --paginate --jq '.files[].filename')
          if echo "$files" | grep -Eq '^(apps/server/|packages/|deploy/robotman/|\.github/workflows/deploy-server\.yaml$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|turbo\.json$)'; then
            echo "server=true" >> "$GITHUB_OUTPUT"
          else
            echo "server=false" >> "$GITHUB_OUTPUT"
            echo "No server files changed in $SHA; skipping the server deploy."
          fi
  deploy:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/robotman-server
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          # The Oracle server is arm64; GitHub's runners are amd64.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: Update the server
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy $TARGET"
          scp -i ~/.ssh/id_deploy deploy/robotman/compose.yaml "$TARGET:/opt/robotman/compose.yaml"
          printf '%s' "$GHCR_TOKEN" | $SSH "docker login ghcr.io -u $GHCR_USER --password-stdin"
          $SSH "cd /opt/robotman && ROBOTMAN_IMAGE=${IMAGE}:${TAG} docker compose pull server && ROBOTMAN_IMAGE=${IMAGE}:${TAG} docker compose up -d --wait --wait-timeout 120"

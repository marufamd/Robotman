name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.11.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # turbo runs each package's build first, which generates the dashboard's route tree.
      - run: pnpm exec turbo run typecheck --cache-dir=.turbo/cache
      # Starts a disposable PostgreSQL container for the server tests.
      - run: pnpm test
      - run: pnpm --filter @robotman/dashboard exec playwright install --with-deps chromium
      - run: pnpm --filter @robotman/dashboard exec playwright test
      - run: node --test test/deploy-config.test.mjs
